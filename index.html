<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>笼中物 · 扳手与幺鸡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1214; }
  body { font-family: system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  /* ---------- 控制面板：五金工具风 ---------- */
  #ui {
    position: fixed; top: 16px; left: 16px; width: 236px;
    background: #191c1e;
    border: 1px solid #2c3237;
    border-radius: 8px;
    padding: 13px 14px 11px;
    color: #dfe5e9; user-select: none; z-index: 10;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.25);
    font-size: 12px;
  }
  #ui header { display: flex; align-items: baseline; gap: 8px; }
  #ui h1 { font-size: 14px; font-weight: 650; letter-spacing: 0.5px; }
  #ui header span { font-size: 10px; color: #78838b; }
  :focus-visible { outline: 1px solid #d9a441; outline-offset: 2px; }
  .sec { margin-top: 12px; }
  .cap {
    font-size: 10px; color: #7d8890; margin-bottom: 6px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .seg { display: flex; gap: 4px; }
  .seg button {
    flex: 1; padding: 6px 0; font-size: 12px; cursor: pointer;
    color: #c6ced4; background: #23282c;
    border: 1px solid #31383d; border-radius: 6px;
    transition: background .15s, color .15s, border-color .15s;
    font-family: inherit;
  }
  .seg button:hover { background: #2b3136; }
  .seg button.active { background: #d9a441; border-color: #d9a441; color: #17110a; font-weight: 650; }
  .colors { display: flex; gap: 6px; }
  .colors label {
    flex: 1; display: flex; flex-direction: column; gap: 3px;
    font-size: 10px; color: #98a2aa; align-items: stretch;
  }
  .colors.one label { flex-direction: row; align-items: center; justify-content: space-between; }
  .colors input[type=color] {
    width: 100%; height: 24px; padding: 1px;
    border: 1px solid #31383d; border-radius: 5px;
    background: none; cursor: pointer;
  }
  .colors input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .colors input[type=color]::-webkit-color-swatch { border: none; border-radius: 3px; }
  .presets { display: flex; gap: 4px; margin-top: 8px; }
  .presets button {
    flex: 1; padding: 0 0 3px; font-size: 10px; color: #aeb8bf; cursor: pointer;
    background: #202427; border: 1px solid #31383d; border-radius: 6px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: inherit; transition: border-color .15s;
  }
  .presets button i { display: block; width: 100%; height: 9px; border-radius: 4px 4px 0 0; }
  .presets button span { padding: 0 2px; }
  .presets button:hover { border-color: #d9a441; color: #e6edf1; }
  .slider { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 10px; color: #98a2aa; }
  .slider input { flex: 1; accent-color: #d9a441; }
  .hint { font-size: 10px; color: #6f7a82; margin-top: 6px; line-height: 1.5; }
  .checks { display: flex; flex-wrap: wrap; row-gap: 6px; gap: 12px; margin-top: 12px; }
  .checks label { font-size: 11px; color: #b9c2c9; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .checks input { accent-color: #d9a441; }
  .tip {
    margin-top: 11px; padding-top: 9px; border-top: 1px solid #262c30;
    font-size: 10px; color: #646e76;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .disabled { opacity: 0.35; pointer-events: none; }
  .hidden { display: none !important; }

  /* ---------- 加载/错误遮罩 ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #10161a; color: #cfe0e8; font-size: 14px; letter-spacing: 2px;
    transition: opacity .6s ease;
  }
  #overlay.done { opacity: 0; pointer-events: none; }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15); border-top-color: #d9a441;
    animation: sp 0.9s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  #overlay .err { color: #ff9a8a; max-width: 320px; text-align: center; line-height: 1.7; }

  @media (max-width: 560px) {
    #ui { width: calc(100% - 24px); left: 12px; top: 12px; padding: 12px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="ui">
  <header><h1>笼中物</h1><span>铁笼 · 扳手 · 幺鸡</span></header>

  <div class="sec">
    <div class="cap">笼中之物</div>
    <div class="seg">
      <button id="btnWrench" class="active">扳手</button>
      <button id="btnTile">幺鸡</button>
    </div>
  </div>

  <div class="sec" id="paintBox">
    <div class="cap">涂装</div>
    <div class="seg">
      <button id="modeGrad" class="active">渐变</button>
      <button id="modeBrush">笔刷</button>
    </div>

    <div id="gradBox" class="sec">
      <div class="colors">
        <label>头部<input type="color" id="cHead" value="#e2761b"></label>
        <label>中段<input type="color" id="cMid" value="#3f9b3f"></label>
        <label>尾环<input type="color" id="cTail" value="#3aa7c9"></label>
      </div>
      <div class="presets">
        <button data-p="ref" title="参考涂装"><i style="background:linear-gradient(90deg,#3aa7c9,#3f9b3f,#e2761b)"></i><span>参考</span></button>
        <button data-p="steel" title="金属原色"><i style="background:linear-gradient(90deg,#9aa1a8,#b9bec4)"></i><span>金属</span></button>
        <button data-p="sunset" title="落日"><i style="background:linear-gradient(90deg,#f0c93b,#e2603b,#8a3a78)"></i><span>落日</span></button>
        <button data-p="jade" title="墨玉"><i style="background:linear-gradient(90deg,#163a2c,#2e8b57,#a8e6c0)"></i><span>墨玉</span></button>
        <button data-p="rand" title="随机配色"><i style="background:#2b3136"></i><span>随机</span></button>
      </div>
    </div>

    <div id="brushBox" class="sec hidden">
      <div class="colors one">
        <label>笔刷颜色<input type="color" id="cBrush" value="#d43a2f"></label>
      </div>
      <div class="slider">大小<input type="range" id="brushSize" min="0.5" max="2.6" step="0.1" value="1.4"></div>
      <div class="hint">在扳手上按住拖动即可上色，涂色时视角不会转动</div>
    </div>
  </div>

  <div class="checks">
    <label><input type="checkbox" id="chkAuto"> 自动环绕</label>
    <label><input type="checkbox" id="chkSpin" checked> 笼子慢转</label>
    <label><input type="checkbox" id="chkSound" checked> 音效</label>
    <label><input type="checkbox" id="chkDebug"> 碰撞框</label>
  </div>
  <div class="tip">拖拽旋转 · 滚轮缩放 · 点击笼子晃动</div>
</div>

<div id="overlay"><div class="spin"></div><div id="ovText">正在生长一棵树…</div></div>

<script>
  window.addEventListener('error', () => {
    const ov = document.getElementById('overlay'); if (!ov || ov.classList.contains('done')) return;
    ov.innerHTML = '<div class="err">资源加载失败 —— 本页面需要联网从 CDN（jsdelivr）加载 Three.js / cannon-es。<br>请检查网络后刷新。</div>';
  }, true);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { createPhysics, CAGE } from './physics.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);

/* ================================================================
   渲染器 / 场景 / 相机
================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('app').appendChild(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe3efe0, 16, 48);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(3.6, 3.2, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.4;
controls.maxDistance = 15;
controls.maxPolarAngle = 1.62;
controls.minPolarAngle = 0.12;
controls.autoRotateSpeed = 0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xfff1da, 2.4);
sun.position.set(7, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 10;  sun.shadow.camera.bottom = -4;
sun.shadow.camera.near = 1;  sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe5ff, 0x51703f, 0.75));

/* ================================================================
   程序化贴图
================================================================ */
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  return t;
}

const grassTex = canvasTexture(256, 256, (x, w, h) => {
  x.fillStyle = '#5f9e4a'; x.fillRect(0, 0, w, h);
  const cs = ['#548c40', '#6cb055', '#578f42', '#68a84e', '#4c8339', '#77b85e'];
  for (let i = 0; i < 5200; i++) {
    x.fillStyle = cs[(Math.random() * cs.length) | 0];
    x.globalAlpha = rand(0.25, 0.7);
    x.fillRect(Math.random() * w, Math.random() * h, rand(1, 2.4), rand(1, 3.2));
  }
  x.globalAlpha = 1;
});
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
grassTex.repeat.set(14, 14);

const barkTex = canvasTexture(128, 256, (x, w, h) => {
  x.fillStyle = '#6b5138'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) {
    x.strokeStyle = ['#57422c', '#7a5f42', '#4a3826'][(Math.random() * 3) | 0];
    x.lineWidth = rand(1, 3);
    const px = Math.random() * w;
    x.beginPath(); x.moveTo(px, 0);
    x.bezierCurveTo(px + rand(-8, 8), h * 0.33, px + rand(-8, 8), h * 0.66, px + rand(-10, 10), h);
    x.stroke();
  }
});
barkTex.wrapS = barkTex.wrapT = THREE.RepeatWrapping;
barkTex.repeat.set(2, 3);

const knurlBump = canvasTexture(64, 64, (x, w, h) => {
  x.fillStyle = '#808080'; x.fillRect(0, 0, w, h);
  x.strokeStyle = '#c8c8c8'; x.lineWidth = 3;
  for (let i = -h; i < w + h; i += 8) {
    x.beginPath(); x.moveTo(i, 0); x.lineTo(i + h, h); x.stroke();
    x.beginPath(); x.moveTo(i + h, 0); x.lineTo(i, h); x.stroke();
  }
});
knurlBump.wrapS = knurlBump.wrapT = THREE.RepeatWrapping;
knurlBump.repeat.set(6, 2);

/* 幺鸡贴图：手绘风绿雀 + 红睛 */
const birdTex = canvasTexture(480, 768, (x) => {
  const g = x.createLinearGradient(0, 0, 0, 768);
  g.addColorStop(0, '#f7f3e8'); g.addColorStop(1, '#eee7d6');
  x.fillStyle = g; x.fillRect(0, 0, 480, 768);
  const green = '#1f8a4e', dark = '#135c3a', lime = '#4fb377', red = '#cf3a2e';
  x.lineJoin = 'round'; x.lineCap = 'round';

  x.save();
  x.translate(240, 384); x.scale(1.18, 1.18); x.translate(-240, -384);   // 整体放大铺满牌面

  const leaf = (bx, by, ang, len, wd, fill, lw) => {
    const a = ang * Math.PI / 180;
    const tx = bx + Math.cos(a) * len, ty = by + Math.sin(a) * len;
    const mx = (bx + tx) / 2, my = (by + ty) / 2;
    const px = -Math.sin(a) * wd, py = Math.cos(a) * wd;
    x.beginPath(); x.moveTo(bx, by);
    x.quadraticCurveTo(mx + px, my + py, tx, ty);
    x.quadraticCurveTo(mx - px, my - py, bx, by);
    x.fillStyle = fill; x.fill();
    x.strokeStyle = dark; x.lineWidth = lw; x.stroke();
  };

  leaf(252, 498, 195, 215, 62, green, 7);          // 尾羽扇
  leaf(252, 498, 225, 240, 66, green, 7);
  leaf(252, 498, 255, 205, 58, green, 7);

  leaf(326, 196, 68, 56, 22, green, 5);            // 头冠
  leaf(330, 190, 94, 60, 22, green, 5);
  leaf(334, 194, 122, 54, 20, green, 5);

  x.beginPath();                                    // 身体
  x.ellipse(255, 385, 92, 128, -0.35, 0, Math.PI * 2);
  x.fillStyle = green; x.fill();
  x.strokeStyle = dark; x.lineWidth = 7; x.stroke();

  x.beginPath();                                    // 翅膀
  x.ellipse(232, 398, 52, 82, -0.5, 0, Math.PI * 2);
  x.fillStyle = lime; x.fill();
  x.strokeStyle = dark; x.lineWidth = 6; x.stroke();
  x.lineWidth = 5;
  for (let i = 0; i < 3; i++) {
    x.beginPath();
    x.arc(228, 452 - i * 34, 46 - i * 6, -2.5, -0.7);
    x.stroke();
  }

  x.beginPath(); x.arc(335, 240, 60, 0, Math.PI * 2);   // 头
  x.fillStyle = green; x.fill();
  x.strokeStyle = dark; x.lineWidth = 7; x.stroke();

  x.beginPath();                                        // 喙
  x.moveTo(388, 224); x.lineTo(432, 244); x.lineTo(388, 264); x.closePath();
  x.fillStyle = dark; x.fill();

  x.beginPath(); x.arc(330, 236, 20, 0, Math.PI * 2);   // 红睛
  x.fillStyle = '#f6f2e7'; x.fill();
  x.strokeStyle = dark; x.lineWidth = 5; x.stroke();
  x.beginPath(); x.arc(330, 236, 12, 0, Math.PI * 2);
  x.fillStyle = red; x.fill();
  x.beginPath(); x.arc(330, 236, 5, 0, Math.PI * 2);
  x.fillStyle = '#20140e'; x.fill();

  x.strokeStyle = dark; x.lineWidth = 9;                // 爪
  x.beginPath(); x.moveTo(230, 502); x.lineTo(224, 560); x.stroke();
  x.beginPath(); x.moveTo(284, 505); x.lineTo(290, 562); x.stroke();
  x.lineWidth = 6;
  for (const [fx, fy] of [[224, 560], [290, 562]]) {
    for (const d of [-16, 0, 16]) {
      x.beginPath(); x.moveTo(fx, fy); x.lineTo(fx + d, fy + 16); x.stroke();
    }
  }
  x.restore();
});

/* ================================================================
   天空 / 地面 / 树 / 环境散布
================================================================ */
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(60, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(0x86b6e0) },
      bot: { value: new THREE.Color(0xe3efe0) },
    },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 bot; varying vec3 vP;
      void main(){ float h = smoothstep(-0.05, 0.45, vP.y); gl_FragColor = vec4(mix(bot, top, h), 1.0); }`,
  })
));

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(45, 64),
  new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1, metalness: 0, envMapIntensity: 0.25 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const barkMat = new THREE.MeshStandardMaterial({ map: barkTex, bumpMap: barkTex, bumpScale: 0.4, roughness: 0.95, envMapIntensity: 0.2 });
const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.55, 5.4, 12), barkMat);
trunk.position.set(-4.3, 2.7, 0);
trunk.rotation.z = 0.04;
trunk.castShadow = true;
scene.add(trunk);

function tubeAlong(pts, radius, mat, seg = 40) {
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), seg, radius, 10), mat);
  m.castShadow = true;
  return m;
}
scene.add(tubeAlong([[-4.15, 4.38, 0], [-3.0, 4.5, 0.1], [-1.6, 4.46, -0.05], [0.4, 4.43, 0]], 0.14, barkMat));
scene.add(tubeAlong([[-2.6, 4.52, 0.05], [-2.2, 5.08, 0.35], [-1.9, 5.38, 0.5]], 0.07, barkMat, 16));

const leafMatA = new THREE.MeshStandardMaterial({ color: 0x3e7d33, roughness: 0.9, flatShading: true, envMapIntensity: 0.25 });
const leafMatB = new THREE.MeshStandardMaterial({ color: 0x478c3a, roughness: 0.9, flatShading: true, envMapIntensity: 0.25 });
const leafMatC = new THREE.MeshStandardMaterial({ color: 0x356b2c, roughness: 0.9, flatShading: true, envMapIntensity: 0.25 });
const leafMats = [leafMatA, leafMatB, leafMatC];
const crownPts = [
  [-4.2, 5.8, 0, 1.9], [-3.2, 5.2, 0.6, 1.3], [-5.2, 5.0, -0.4, 1.4],
  [-4.0, 6.6, 0.5, 1.2], [-4.6, 5.0, 1.0, 1.1], [-3.0, 6.0, -0.7, 1.0], [-1.85, 5.75, 0.55, 0.85],
];
for (const [px, py, pz, r] of crownPts) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), leafMats[(Math.random() * 3) | 0]);
  m.position.set(px, py, pz);
  m.scale.y = 0.85;
  m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  m.castShadow = true;
  scene.add(m);
}

function distantTree(px, pz, s) {
  const g = new THREE.Group();
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * s, 0.18 * s, 1.7 * s, 8), barkMat);
  t.position.y = 0.85 * s; t.castShadow = true; g.add(t);
  const c1 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15 * s, 1), leafMats[(Math.random() * 3) | 0]);
  c1.position.y = 2.15 * s; c1.scale.y = 1.15; c1.castShadow = true; g.add(c1);
  const c2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.75 * s, 1), leafMats[(Math.random() * 3) | 0]);
  c2.position.set(0.5 * s, 1.7 * s, 0.2 * s); c2.castShadow = true; g.add(c2);
  g.position.set(px, 0, pz);
  scene.add(g);
}
for (const [px, pz, s] of [[10, -8, 1.6], [-9, -12, 2], [14, 4, 1.8], [-14, 8, 1.7], [8, 12, 1.5], [-6, -18, 2.4], [18, -4, 2], [-16, -4, 1.4]]) distantTree(px, pz, s);

const bushGeo = new THREE.IcosahedronGeometry(1, 1);
for (const [px, pz, r] of [[3.5, -2.5, 0.8], [-3, 3, 0.7], [5, 3, 0.9], [-5, -3.5, 0.6], [2.5, 4.5, 0.55], [-6, 1.5, 0.75]]) {
  const m = new THREE.Mesh(bushGeo, leafMats[(Math.random() * 3) | 0]);
  m.position.set(px, r * 0.45, pz);
  m.scale.set(r, r * 0.6, r);
  m.rotation.y = Math.random() * 3;
  m.castShadow = true;
  scene.add(m);
}
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x8a8d90, roughness: 1, flatShading: true, envMapIntensity: 0.2 });
for (const [px, pz, r] of [[1.8, -1.2, 0.26], [-2.4, -2, 0.34], [3, 1.8, 0.2], [-1.6, 3.2, 0.17]]) {
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), stoneMat);
  m.position.set(px, r * 0.5, pz);
  m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  m.castShadow = true;
  scene.add(m);
}

/* ================================================================
   铁丝鸟笼（视觉）：底盘 y0.1 → 立柱到 y2.0 → 穹顶收拢 → 顶环挂钩
   笼体位姿完全由物理刚体驱动（真实单摆 + 自转）
================================================================ */
const cageMat = new THREE.MeshStandardMaterial({ color: 0x17181a, metalness: 0.85, roughness: 0.38, envMapIntensity: 1.0 });
const baseMat = new THREE.MeshStandardMaterial({ color: 0x101114, metalness: 0.3, roughness: 0.9, envMapIntensity: 0.3 });

const hangPivot = new THREE.Group();          // 悬挂点（树枝上，静止）
hangPivot.position.set(0.4, 4.43, 0);         // 笼底离地 0.45：贴近草地，影子不脱节
scene.add(hangPivot);

function torus(r, tube, mat) { return new THREE.Mesh(new THREE.TorusGeometry(r, tube, 12, 40), mat); }
const loop = torus(0.2, 0.03, cageMat);       // 树枝缠绕环
loop.rotation.y = Math.PI / 2;
hangPivot.add(loop);

const chainGroup = new THREE.Group();         // 链条：倾斜量取笼体的一半，看起来柔韧不脱节
hangPivot.add(chainGroup);
for (let i = 0; i < 4; i++) {
  const link = torus(0.095, 0.027, cageMat);
  link.position.y = -0.1 - i * 0.14;
  link.rotation.y = i % 2 ? Math.PI / 2 : 0;
  chainGroup.add(link);
}

const cageGroup = new THREE.Group();          // 笼体：位姿完全由物理刚体驱动
cageGroup.position.y = -0.52 - 0.14 - 3.32;   // 链条末端接笼顶挂钩
hangPivot.add(cageGroup);

const base = new THREE.Mesh(new THREE.CylinderGeometry(1.04, 1.0, 0.05, 48), baseMat);
base.position.y = 0.075;                      // 顶面仍是 0.1，与物理地板对齐；盘身减薄一半
base.castShadow = base.receiveShadow = true;
cageGroup.add(base);
const rim = torus(1.02, 0.032, cageMat);
rim.rotation.x = Math.PI / 2;
rim.position.y = 0.098;
cageGroup.add(rim);

const barGeo = new THREE.CylinderGeometry(0.028, 0.028, 1.9, 8);
for (let i = 0; i < 16; i++) {
  const a = i * Math.PI * 2 / 16;
  const bar = new THREE.Mesh(barGeo, cageMat);
  bar.position.set(Math.cos(a) * 0.965, 1.05, Math.sin(a) * 0.965);
  bar.castShadow = true;
  cageGroup.add(bar);
}

for (const [y, r, t] of [[1.0, 0.985, 0.034], [2.0, 0.965, 0.04]]) {
  const ring = torus(r, t, cageMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  ring.castShadow = true;
  cageGroup.add(ring);
}

for (let i = 0; i < 8; i++) {
  const a = i * Math.PI * 2 / 8 + Math.PI / 16;
  const c = Math.cos(a), s = Math.sin(a);
  const rib = tubeAlong([
    [0.10 * c, 3.06, 0.10 * s],
    [0.45 * c, 2.85, 0.45 * s],
    [0.78 * c, 2.50, 0.78 * s],
    [0.965 * c, 2.00, 0.965 * s],
  ], 0.03, cageMat, 24);
  cageGroup.add(rib);
}
const domeRing = torus(0.78, 0.03, cageMat);
domeRing.rotation.x = Math.PI / 2;
domeRing.position.y = 2.5;
cageGroup.add(domeRing);

const apexRing = torus(0.1, 0.03, cageMat);
apexRing.rotation.x = Math.PI / 2;
apexRing.position.y = 3.08;
cageGroup.add(apexRing);
const finial = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), cageMat);
finial.position.y = 3.17;
cageGroup.add(finial);
const hookRing = torus(0.12, 0.032, cageMat);
hookRing.position.y = 3.32;
cageGroup.add(hookRing);

const knob = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 10), cageMat);
knob.position.set(0, 1.35, 1.02);
cageGroup.add(knob);
const latch = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.2, 0.028), cageMat);
latch.position.set(0, 1.12, 0.995);
cageGroup.add(latch);

/* ================================================================
   扳手（挤出成型，顶点色渐变涂装，可笔刷涂色）
================================================================ */
const wrenchGroup = new THREE.Group();
wrenchGroup.scale.setScalar(0.16);
cageGroup.add(wrenchGroup);

const paintSteel = new THREE.MeshStandardMaterial({
  color: 0xffffff, vertexColors: true, metalness: 0.65, roughness: 0.36, envMapIntensity: 0.9,
});
const paintMeshes = [];

function extrude(shape, depth = 0.4, bevel = 0.08) {
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 48,
  });
  g.translate(0, 0, -depth / 2);
  return g;
}
function addPaintMesh(geo) {
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3), 3));
  const m = new THREE.Mesh(geo, paintSteel);
  m.castShadow = m.receiveShadow = true;
  wrenchGroup.add(m);
  paintMeshes.push(m);
  return m;
}

{
  const s = new THREE.Shape();
  s.absarc(0.55, 0, 0.55, Math.PI / 2, Math.PI * 1.5, false);   // 圆尾
  s.lineTo(8.9, -0.62);
  s.lineTo(8.9, 0.62);
  s.lineTo(2.0, 0.55);
  const hole = new THREE.Path();
  hole.absarc(0.55, 0, 0.26, 0, Math.PI * 2, true);
  s.holes.push(hole);
  const g = extrude(s);
  g.translate(-5.6, 0, 0);
  addPaintMesh(g);
}
{
  const s = new THREE.Shape();
  s.moveTo(8.9, -0.72); s.lineTo(10.45, -0.72); s.lineTo(10.45, -0.06); s.lineTo(8.9, -0.06);
  const g = extrude(s);
  g.translate(-5.6, 0, 0);
  addPaintMesh(g);
}
{
  const R = 1.38, r = 0.62, hw = 0.3;
  const aOut = Math.atan2(Math.sqrt(R * R - hw * hw), hw);
  const aIn = Math.atan2(Math.sqrt(r * r - hw * hw), hw);
  const s = new THREE.Shape();
  s.absarc(0, 0, R, aOut, Math.PI - aOut - Math.PI * 2, true);
  s.lineTo(-hw, Math.sqrt(r * r - hw * hw));
  s.absarc(0, 0, r, Math.PI - aIn, aIn - Math.PI * 2, true);
  s.lineTo(hw, Math.sqrt(R * R - hw * hw));
  const g = extrude(s);
  g.translate(9.95 - 5.6, 0.55, 0);
  addPaintMesh(g);
}
{
  const g = new THREE.CylinderGeometry(0.21, 0.21, 1.1, 24);
  g.rotateZ(Math.PI / 2);
  g.translate(9.95 - 5.6, 0.8, 0);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: 0xc9ced4, metalness: 0.95, roughness: 0.3, bumpMap: knurlBump, bumpScale: 0.6, envMapIntensity: 1.0,
  }));
  m.castShadow = true;
  wrenchGroup.add(m);
}

const paintState = { head: '#e2761b', mid: '#3f9b3f', tail: '#3aa7c9' };
const X0 = -5.6, X1 = 9.95 + 1.38 - 5.6;
function applyGradient() {
  const cT = new THREE.Color(paintState.tail), cM = new THREE.Color(paintState.mid), cH = new THREE.Color(paintState.head);
  const tmp = new THREE.Color();
  for (const mesh of paintMeshes) {
    const pos = mesh.geometry.attributes.position, col = mesh.geometry.attributes.color;
    for (let i = 0; i < pos.count; i++) {
      const t = THREE.MathUtils.clamp((pos.getX(i) - X0) / (X1 - X0), 0, 1);
      if (t < 0.45) tmp.copy(cT).lerp(cM, t / 0.45);
      else tmp.copy(cM).lerp(cH, (t - 0.45) / 0.55);
      col.setXYZ(i, tmp.r, tmp.g, tmp.b);
    }
    col.needsUpdate = true;
  }
}
applyGradient();

/* ================================================================
   幺鸡麻将牌
================================================================ */
const tileGroup = new THREE.Group();
cageGroup.add(tileGroup);
{
  const ivory = new THREE.MeshPhysicalMaterial({
    color: 0xf2ede0, roughness: 0.42, metalness: 0, clearcoat: 0.55, clearcoatRoughness: 0.3, envMapIntensity: 0.6,
  });
  const body = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.92, 0.42, 4, 0.06), ivory);
  body.castShadow = body.receiveShadow = true;
  tileGroup.add(body);
  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(0.47, 0.77),
    new THREE.MeshStandardMaterial({ map: birdTex, roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -2 })
  );
  face.position.z = 0.2112;
  tileGroup.add(face);
}

/* ================================================================
   物理接线：笼子 = 动力学 compound，点约束挂在树枝锚点上。
   摆动 / 自转 / 碰撞全部真实解算（physics.js 与回归测试共用）
================================================================ */
const phys = createPhysics({
  origin: { x: hangPivot.position.x, y: hangPivot.position.y - CAGE.pivotLocalY, z: hangPivot.position.z },
});
const { cageBody, wrenchBody, tileBody, SPAWN, resetBody } = phys;
const _yDir = new THREE.Vector3();

/* 调试：碰撞模型线框（面板「碰撞框」开关）——笼子=青 扳手=橙 幺鸡=品红 */
const debugGroup = new THREE.Group();
debugGroup.visible = false;
scene.add(debugGroup);
function addDebugBody(body, color) {
  const geos = [];
  for (let i = 0; i < body.shapes.length; i++) {
    const he = body.shapes[i].halfExtents;
    if (!he) continue;                                   // 仅可视化 Box 碰撞体
    const g = new THREE.EdgesGeometry(new THREE.BoxGeometry(he.x * 2, he.y * 2, he.z * 2));
    g.applyMatrix4(new THREE.Matrix4().compose(
      new THREE.Vector3(body.shapeOffsets[i].x, body.shapeOffsets[i].y, body.shapeOffsets[i].z),
      new THREE.Quaternion(
        body.shapeOrientations[i].x, body.shapeOrientations[i].y,
        body.shapeOrientations[i].z, body.shapeOrientations[i].w
      ),
      new THREE.Vector3(1, 1, 1)
    ));
    geos.push(g);
  }
  const g = new THREE.Group();
  g.add(new THREE.LineSegments(
    mergeGeometries(geos),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55, depthTest: false })
  ));
  debugGroup.add(g);
  return g;
}
const debugCage = addDebugBody(cageBody, 0x00e5ff);
const debugWrench = addDebugBody(wrenchBody, 0xff9500);
const debugTile = addDebugBody(tileBody, 0xff40ff);

function syncVisuals() {
  cageGroup.position.set(
    cageBody.position.x - hangPivot.position.x,
    cageBody.position.y - hangPivot.position.y,
    cageBody.position.z - hangPivot.position.z
  );
  cageGroup.quaternion.copy(cageBody.quaternion);
  wrenchGroup.position.copy(wrenchBody.position);
  wrenchGroup.quaternion.copy(wrenchBody.quaternion);
  tileGroup.position.copy(tileBody.position);
  tileGroup.quaternion.copy(tileBody.quaternion);
  /* 链条半跟随笼体倾斜：笼子摆动时链条被"拽"过去一半，不再各晃各的 */
  _yDir.set(0, 1, 0).applyQuaternion(cageGroup.quaternion);
  chainGroup.rotation.z = -Math.asin(THREE.MathUtils.clamp(_yDir.x, -1, 1)) * 0.45;
  chainGroup.rotation.x = Math.asin(THREE.MathUtils.clamp(_yDir.z, -1, 1)) * 0.45;
  debugCage.position.copy(cageBody.position);
  debugCage.quaternion.copy(cageBody.quaternion);
  debugWrench.position.copy(wrenchBody.position);
  debugWrench.quaternion.copy(wrenchBody.quaternion);
  debugTile.position.copy(tileBody.position);
  debugTile.quaternion.copy(tileBody.quaternion);
}
syncVisuals();

/* ================================================================
   音效：WebAudio 合成金属撞击（非谐分音 + 带通噪声瞬态）
================================================================ */
let soundOn = true, audioCtx = null, _lastClink = 0;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function clank(strength) {
  if (!soundOn || !audioCtx || audioCtx.state !== 'running') return;
  const t0 = audioCtx.currentTime;
  const out = audioCtx.createGain();
  out.gain.setValueAtTime(Math.min(0.4, 0.05 + strength * 0.09), t0);
  out.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22 + strength * 0.12);
  out.connect(audioCtx.destination);
  const base = 460 + Math.random() * 180;
  for (const [ratio, amp, dec] of [[1, 1, 0.28], [2.32, 0.55, 0.2], [3.98, 0.35, 0.14], [6.21, 0.22, 0.1]]) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(base * ratio, t0);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(amp, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    o.connect(g).connect(out);
    o.start(t0);
    o.stop(t0 + dec + 0.05);
  }
  const n = audioCtx.createBufferSource();
  const buf = audioCtx.createBuffer(1, 1000, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
  n.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 2200 + Math.random() * 900; bp.Q.value = 0.9;
  const ng = audioCtx.createGain(); ng.gain.value = 0.5;
  n.connect(bp).connect(ng).connect(out);
  n.start(t0);
}
function onItemCollide(e) {
  const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
  const now = performance.now();
  if (v < 0.9 || now - _lastClink < 70) return;
  _lastClink = now;
  clank(Math.min(1.6, v / 3));
}
wrenchBody.addEventListener('collide', onItemCollide);
tileBody.addEventListener('collide', onItemCollide);

/* ================================================================
   物件切换（弹入动画）
================================================================ */
let current = 'wrench';
wrenchGroup.visible = true; tileGroup.visible = false;
let popStart = -1;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function setItem(name) {
  if (name === current) return;
  current = name;
  wrenchGroup.visible = name === 'wrench';
  tileGroup.visible = name === 'tile';
  (name === 'wrench' ? wrenchGroup : tileGroup).scale.setScalar(0.001);
  popStart = performance.now();
  resetBody(name === 'wrench' ? wrenchBody : tileBody, SPAWN[name]);
  $('btnWrench').classList.toggle('active', name === 'wrench');
  $('btnTile').classList.toggle('active', name === 'tile');
  $('paintBox').classList.toggle('disabled', name !== 'wrench');
  if (name !== 'wrench') stopPainting();
}
$('btnWrench').onclick = () => setItem('wrench');
$('btnTile').onclick = () => setItem('tile');

/* ================================================================
   涂装 UI
================================================================ */
const bindColor = (id, key) => $(id).addEventListener('input', e => { paintState[key] = e.target.value; applyGradient(); });
bindColor('cHead', 'head'); bindColor('cMid', 'mid'); bindColor('cTail', 'tail');

const PRESETS = {
  ref: ['#e2761b', '#3f9b3f', '#3aa7c9'],
  steel: ['#b9bec4', '#aeb4ba', '#9aa1a8'],
  sunset: ['#e2603b', '#c94a6a', '#f0c93b'],
  jade: ['#a8e6c0', '#2e8b57', '#163a2c'],
};
document.querySelectorAll('.presets button').forEach(b => {
  b.onclick = () => {
    if (b.dataset.p === 'rand') {
      const hue = Math.random() * 360;
      ['head', 'mid', 'tail'].forEach((k, i) => {
        paintState[k] = '#' + new THREE.Color().setHSL(((hue + i * 55) % 360) / 360, 0.62, 0.55).getHexString();
      });
    } else {
      [paintState.head, paintState.mid, paintState.tail] = PRESETS[b.dataset.p];
    }
    $('cHead').value = paintState.head; $('cMid').value = paintState.mid; $('cTail').value = paintState.tail;
    applyGradient();
  };
});

let brushMode = false, brushColor = '#d43a2f', brushRadius = 1.4;
$('modeGrad').onclick = () => {
  brushMode = false;
  $('modeGrad').classList.add('active'); $('modeBrush').classList.remove('active');
  $('gradBox').classList.remove('hidden'); $('brushBox').classList.add('hidden');
};
$('modeBrush').onclick = () => {
  brushMode = true;
  $('modeBrush').classList.add('active'); $('modeGrad').classList.remove('active');
  $('brushBox').classList.remove('hidden'); $('gradBox').classList.add('hidden');
};
$('cBrush').addEventListener('input', e => brushColor = e.target.value);
$('brushSize').addEventListener('input', e => brushRadius = parseFloat(e.target.value));

/* 笔刷涂色 / 点击晃动：共用同一套射线拾取 */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let painting = false;
function updateRay(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function paintAt(ev) {
  updateRay(ev);
  const hits = ray.intersectObjects(paintMeshes, false);
  if (!hits.length) return;
  const local = wrenchGroup.worldToLocal(hits[0].point.clone());
  const c = new THREE.Color(brushColor), tmp = new THREE.Color();
  for (const mesh of paintMeshes) {
    const pos = mesh.geometry.attributes.position, col = mesh.geometry.attributes.color;
    for (let i = 0; i < pos.count; i++) {
      const dx = pos.getX(i) - local.x, dy = pos.getY(i) - local.y, dz = pos.getZ(i) - local.z;
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < brushRadius) {
        const w = Math.pow(1 - d / brushRadius, 1.4);
        tmp.fromBufferAttribute(col, i).lerp(c, w);
        col.setXYZ(i, tmp.r, tmp.g, tmp.b);
      }
    }
    col.needsUpdate = true;
  }
}
function stopPainting() { if (painting) { painting = false; controls.enabled = true; } }
renderer.domElement.addEventListener('pointerdown', ev => {
  ensureAudio();               // 首次交互时解锁音频（浏览器自动播放策略）
  updateRay(ev);
  /* 笔刷模式下按在扳手上 → 涂色（视角锁定） */
  if (brushMode && current === 'wrench' && ray.intersectObjects(paintMeshes, false).length) {
    painting = true;
    controls.enabled = false;
    paintAt(ev);
    return;
  }
  /* 点击笼子或笼内物品 → 物理冲量晃动，物品被抛起 */
  const itemHit = current === 'wrench'
    ? ray.intersectObject(wrenchGroup, true).length
    : ray.intersectObject(tileGroup, true).length;
  if (itemHit || ray.intersectObjects(cageMeshes, false).length) shakeCage();
});
/* 悬停指针：可点击处显示抓手 */
renderer.domElement.addEventListener('pointermove', ev => {
  if (painting) { renderer.domElement.style.cursor = 'crosshair'; return; }
  updateRay(ev);
  let hit = ray.intersectObjects(cageMeshes, false).length > 0;
  if (!hit) hit = current === 'wrench'
    ? ray.intersectObject(wrenchGroup, true).length > 0
    : ray.intersectObject(tileGroup, true).length > 0;
  renderer.domElement.style.cursor = hit ? 'grab' : '';
});
window.addEventListener('pointermove', ev => { if (painting) paintAt(ev); });
window.addEventListener('pointerup', stopPainting);
window.addEventListener('pointercancel', stopPainting);

/* 点击笼子 → 物理冲量晃动 + 笼内物品被抛起 */
const cageMeshes = [];
hangPivot.traverse(o => { if (o.isMesh) cageMeshes.push(o); });
function shakeCage() {
  phys.shake(current);
  clank(1.3);
}

/* ================================================================
   视角 / 音效开关
================================================================ */
let autoRotate = false, spinning = true;
$('chkAuto').onchange = e => autoRotate = e.target.checked;
$('chkSpin').onchange = e => spinning = e.target.checked;
$('chkSound').onchange = e => soundOn = e.target.checked;
$('chkDebug').onchange = e => debugGroup.visible = e.target.checked;

/* ================================================================
   主循环
================================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1 / 30);

  /* 笼内物理：摆动 / 自转 / 碰撞全部真实解算（涂色时暂停自转） */
  phys.setSpin(spinning && !painting);
  phys.step(dt);
  syncVisuals();

  /* 弹入动画 */
  if (popStart >= 0) {
    const k = (performance.now() - popStart) / 400;
    const item = current === 'wrench' ? wrenchGroup : tileGroup;
    if (k >= 1) { item.scale.setScalar(current === 'wrench' ? 0.16 : 1); popStart = -1; }
    else item.scale.setScalar(Math.max(0.001, easeOutBack(k)) * (current === 'wrench' ? 0.16 : 1));
  }

  controls.autoRotate = autoRotate && !painting;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 完成：撤掉加载遮罩 */
$('overlay').classList.add('done');
</script>
</body>
